<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
    <title>
      <!--@TITLE@-->
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Lacquer&display=swap"
      rel="stylesheet">
    <!--@PREFETCH@-->
    <link rel="stylesheet" href="/style.css?v=4">
    <!--@PAGE_STYLE@-->
  </head>
  <body>
    <header>
      <img class="logo-icon" src="/logo.png" alt="19 PvP Logo">
      <nav id="siteNavigation" class="site-navigation" aria-label="Primary navigation">
        <a class="site-nav-account" data-nav-page="account" href="/account">
          <img id="siteNavAccountAvatar" class="avatar site-nav-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Account avatar">
          <span id="siteNavAccountName">Register or Login</span>
        </a>
        <span class="site-nav-separator" aria-hidden="true">|</span>
        <a data-nav-page="about" href="/about">About</a>
        <span class="site-nav-separator" aria-hidden="true">|</span>
        <a data-nav-page="leaderboards" href="/leaderboards">Leaderboards</a>
        <span class="site-nav-separator" aria-hidden="true">|</span>
        <a data-nav-page="install" href="/install">Installer &amp; Patcher</a>
      </nav>
    </header>
    <div class="container<!--@CONTAINER_CLASS@-->">
      <div id="topLoadingBarContainer"
        style="position: absolute; top: 0; left: 0; right: 0; height: 12px; overflow: hidden; pointer-events: none;">
        <svg style="display: none;">
          <path id="handDrawnBorderPath"
            d="M1.7 2.7q7.5-.2 34 .4a1197 1197 0 0 0 58.9.5l24.2.1a1168 1168 0 0 0 45-.6q6 0 17.3-.6 11.5-.4 16-.4t13 .7 29.1.2 30.3-.1 31.8.3a3411 3411 0 0 0 69.6-.7q10-.3 24.2-.1t52.1 0h54.5q16.5 0 38.5-.4t33.7-.4 29.9.7a416 416 0 0 0 36.6.2" />
        </svg>
        <svg class="progress-bar-svg" viewBox="-1 0 644.1 5.4" preserveAspectRatio="none"
          style="width: 100%; height: 100%; display: block;">
          <defs>
            <linearGradient id="progressGradTopBar" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="var(--discord-color)" />
              <stop offset="100%" stop-color="var(--accent-color)" />
            </linearGradient>
          </defs>
          <use href="#handDrawnBorderPath" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-linecap="round"
            stroke-linejoin="round" stroke-width="4" />
          <use id="topLoadingPath" href="#handDrawnBorderPath" fill="none" stroke="url(#progressGradTopBar)"
            stroke-linecap="round" stroke-linejoin="round" stroke-width="4" stroke-dasharray="750"
            stroke-dashoffset="0" />
        </svg>
      </div>
      <!--@PAGE_CONTENT@-->
    </div>
    <footer class="site-footer">
      <div>19 PvP · A Twinking Battleground &amp; Arena Server</div>
      <div><a href="https://github.com/19pvp/19pvp.github.io" target="_blank" rel="noreferrer">Open source on GitHub</a> · Built on AzerothCore, mod-playerbots, and mod-ale.</div>
      <small>Non-commercial fan project for learning and fun; Blizzard and its assets belong to Blizzard Entertainment.</small>
    </footer>
    <!--@PAGE_SCRIPT@-->
  </body>
</html>
