<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>19PvP Launcher</title>
    <style>
    :root {
      color-scheme: dark;
      font: 15px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body {
      margin: 0;
      padding: 24px;
      background: #111827;
      color: #d1d5db;
    }
    main {
      max-width: 1000px;
      margin: auto;
    }
    h1 {
      color: #f9fafb;
      font: 600 20px/1.2 system-ui, sans-serif;
    }
    label {
      display: block;
      margin: 24px 0 4px;
      font-family: system-ui, sans-serif;
    }
    #directory-message {
      color: #9ca3af;
      font-size: 13px;
    }
    #status {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #1f2937;
    }
    #state {
      color: #f9fafb;
      font: 600 18px system-ui, sans-serif;
    }
    progress {
      display: block;
      width: 100%;
      margin: 12px 0;
    }
    #stats {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: #9ca3af;
    }
    #help {
      margin-top: 12px;
      color: #d1d5db;
      font-family: system-ui, sans-serif;
    }
    #stopped {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #d1d5db;
      font-family: system-ui, sans-serif;
    }
    #saved-path {
      margin: 8px 0;
      color: #9ca3af;
    }
    button {
      margin-left: 12px;
    }
    #help a {
      color: #fde68a;
    }
    details {
      margin-top: 24px;
    }
    #logs {
      height: 50vh;
      margin-top: 12px;
      overflow: auto;
      padding: 16px;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #030712;
      white-space: pre-wrap;
    }
    </style>
  </head>
  <body>
    <main>
      <h1>19PvP Launcher</h1>
      <div>
        <button id="choose-directory" type="button">Choose download folder</button>
        <span id="directory-message">No folder selected.</span>
      </div>
      <div id="download-path">Download directory: loading…</div>
      <section id="status" aria-live="polite">
        <div id="state">Starting</div>
        <progress id="progress" max="1" value="0"></progress>
        <div
          id="stats"><span id="downloaded">0 B / 0 B</span><span id="speed">0 B/s</span><span id="eta">Left: unknown</span><span id="peers">0 peers</span></div>
        <div id="help"
          hidden>Need help? Create a report link and send it to support. <a id="share-logs" href="#">Create report link</a><span id="share-result"></span></div>
        <div id="stopped" hidden>
          <div id="stopped-message">Launcher service stopped.</div>
          <div id="saved-path">Files saved in: unknown</div>
          <button id="close-page" type="button">Close page</button><span id="close-message"></span>
        </div>
      </section>
      <details id="log-details">
        <summary>Logs</summary>
        <pre id="logs" role="log">Connecting to launcher…</pre>
      </details>
    </main>
    <script>
    const logView = document.querySelector('#logs')
    const state = document.querySelector('#state')
    const progress = document.querySelector('#progress')
    const downloaded = document.querySelector('#downloaded')
    const speed = document.querySelector('#speed')
    const eta = document.querySelector('#eta')
    const peers = document.querySelector('#peers')
    const downloadPath = document.querySelector('#download-path')
    const directoryMessage = document.querySelector('#directory-message')
    const help = document.querySelector('#help')
    const logDetails = document.querySelector('#log-details')
    const shareLogs = document.querySelector('#share-logs')
    const shareResult = document.querySelector('#share-result')
    const stopped = document.querySelector('#stopped')
    const stoppedMessage = document.querySelector('#stopped-message')
    const savedPath = document.querySelector('#saved-path')
    const closePage = document.querySelector('#close-page')
    const closeMessage = document.querySelector('#close-message')
    const rememberPath = (label, path) => {
      const text = label + path
      downloadPath.textContent = text
      savedPath.textContent = 'Files saved in: ' + path
    }
    let lastMovingAt = Date.now()
    let lastDownloaded = '0 B'
    let isComplete = false
    let reportVisible = false
    let serviceStopped = false
    const updateHelpVisibility = () => {
      help.hidden = !(reportVisible || serviceStopped || logDetails.open)
    }
    const updateStatus = (message) => {
      if (message === 'completed') {
        state.textContent = 'Completed'
        isComplete = true
      } else if (message.includes('error:')) state.textContent = 'Error'
      else if (message === 'torrent loaded') state.textContent = 'Loading torrent'
      else if (message.startsWith('metadata received:')) {
        state.textContent = 'Checking existing data'
      } else if (message === 'torrent ready; existing data checked') {
        state.textContent = 'Downloading'
      } else if (message === 'launcher stopped') state.textContent = 'Stopped'
      else if (message.startsWith('download directory:')) {
        rememberPath(
          'Download directory: ',
          message.slice('download directory:'.length).trim(),
        )
      } else if (message.startsWith('client files root:')) {
        rememberPath(
          'Client files root: ',
          message.slice('client files root:'.length).trim(),
        )
      }
      const match = message.match(
        /^status: peers=(\d+) speed=(.+?)\/s progress=([\d.]+)% downloaded=(.+?)\/(.+?) eta=(.+)$/,
      )
      if (!match) return
      peers.textContent = match[1] + ' peers'
      speed.textContent = match[2] + '/s'
      eta.textContent = match[6].startsWith('checking local files ')
        ? 'Checking local files: ' + match[6].slice('checking local files '.length)
        : 'Left: ' + match[6]
      downloaded.textContent = match[4] + ' / ' + match[5]
      progress.value = Number(match[3]) / 100
      isComplete = Number(match[3]) >= 100
      if (match[2] !== '0 B' || match[4] !== lastDownloaded) {
        lastMovingAt = Date.now()
        reportVisible = false
        updateHelpVisibility()
      }
      lastDownloaded = match[4]
    }
    const append = (entry) => {
      if (logView.dataset.lastMessage === entry.message) return
      logView.dataset.lastMessage = entry.message
      if (logView.textContent === 'Connecting to launcher…') {
        logView.textContent = ''
      }
      const shouldScroll = logView.scrollTop + logView.clientHeight >= logView.scrollHeight - 8
      logView.textContent += '[' + entry.timestamp + '] ' + entry.message + '\n'
      if (shouldScroll) logView.scrollTop = logView.scrollHeight
      updateStatus(entry.message)
    }
    document.querySelector('#choose-directory').onclick = async () => {
      directoryMessage.textContent = 'Opening folder picker…'
      const response = await fetch('/pick-directory', { method: 'POST' })
      const data = await response.json()
      if (!response.ok) {
        directoryMessage.textContent = 'Could not use this folder: ' + (data.error || response.status)
        return
      }
      if (data.canceled) {
        directoryMessage.textContent = 'No folder selected. Nothing changed.'
        return
      }
      if (data.changed === false) {
        directoryMessage.textContent = 'This is already the download folder.'
        return
      }
      rememberPath('Download directory: ', data.clientPath || data.downloadPath)
      directoryMessage.textContent = 'Folder changed. Existing files are being checked.'
    }
    const stream = new EventSource('/events')
    stream.onmessage = (event) => append(JSON.parse(event.data))
    stream.onerror = () => {
      if (serviceStopped) return
      state.textContent = 'Launcher service stopped'
      stoppedMessage.textContent = isComplete
        ? 'Launcher service stopped. The download is complete.'
        : 'Launcher service stopped. The download is partial. Restart the launcher to safely resume.'
      stopped.hidden = false
      serviceStopped = true
      updateHelpVisibility()
      append({
        timestamp: new Date().toISOString(),
        message: 'launcher service stopped',
      })
    }
    setInterval(() => {
      if (serviceStopped) return
      if (state.textContent !== 'Completed' && Date.now() - lastMovingAt > 30000) {
        reportVisible = true
        updateHelpVisibility()
      }
    }, 1000)
    const uploadLogs = async (event, result) => {
      event.preventDefault()
      result.textContent = ' uploading…'
      const response = await fetch('/share-logs', { method: 'POST' })
      const data = await response.json()
      if (!response.ok) {
        result.textContent = ' failed: ' + (data.error || response.status)
        return
      }
      result.textContent = ' '
      const link = document.createElement('a')
      link.href = data.url
      link.target = '_blank'
      link.textContent = data.url
      result.append(link)
    }
    shareLogs.onclick = (event) => uploadLogs(event, shareResult)
    logDetails.ontoggle = updateHelpVisibility
    closePage.onclick = () => {
      window.close()
      closeMessage.textContent = ' You can close this tab.'
    }
    window.addEventListener('pagehide', () => {
      if (!serviceStopped) navigator.sendBeacon('/shutdown')
    })
    fetch('/api')
      .then((response) => response.json())
      .then((status) => {
        if (status.downloadPath) {
          rememberPath('Download directory: ', status.clientPath || status.downloadPath)
        }
      })
    </script>
  </body>
</html>
